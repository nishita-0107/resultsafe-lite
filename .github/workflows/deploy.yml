name: ResultSafe CI/CD
on:
  push:
    branches: [main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
  scan:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only
      - run: npm audit --audit-level=high
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Rolling replace servers
        run: |
          TG=$(aws elbv2 describe-target-groups --names resultsafe-tg --query 'TargetGroups[0].TargetGroupArn' --output text)
          for ID in $(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names resultsafe-asg --query 'AutoScalingGroups[0].Instances[].InstanceId' --output text); do
            echo "Replacing $ID"
            aws autoscaling terminate-instance-in-auto-scaling-group --instance-id $ID --no-should-decrement-desired-capacity
            sleep 60
            for i in $(seq 1 30); do
              HEALTHY=$(aws elbv2 describe-target-health --target-group-arn $TG --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" --output text)
              echo "Healthy targets: $HEALTHY"
              if [ "$HEALTHY" -ge 2 ]; then break; fi
              sleep 20
            done
          done
      - name: Smoke test
        run: curl -f http://${{ secrets.ALB_DNS }}/health